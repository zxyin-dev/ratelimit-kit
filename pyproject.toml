[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimit-kit"
version = "1.0.0"
description = "采集类程序的限流、退避、断点与幂等落盘（零依赖）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rate-limit", "backoff", "retry", "429", "checkpoint", "scraping", "idempotent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zxyin-dev/ratelimit-kit"
Repository = "https://github.com/zxyin-dev/ratelimit-kit"

[tool.setuptools]
packages = ["ratelimit_kit"]
